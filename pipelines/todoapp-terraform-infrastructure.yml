trigger:
  - dev # Trigger on changes to the dev branch

pool:
  vmImage: "ubuntu-latest"

variables:
  # --- Terraform State Backend Configuration ---
  tf_backend_resource_group: "rg-terraform-state"
  tf_backend_storage_account: "tfstate12072025"
  tf_backend_container: "tfstate"
  tf_backend_key: "todo-app.tfstate"

  # --- Application Variables ---
  projectPrefix: "todo-app"
  environment: "dev"
  pythonVersion: "3.12"

  # --- Service Connection ---
  serviceConnection: "sp-deploy"

stages:
  - stage: Infrastructure
    displayName: "Deploy Infrastructure"
    jobs:
      - job: Terraform
        displayName: "Terraform Apply"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(tf_backend_resource_group)
              backendAzureRmStorageAccountName: $(tf_backend_storage_account)
              backendAzureRmContainerName: $(tf_backend_container)
              backendAzureRmKey: $(tf_backend_key)

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              environmentServiceNameAzureRM: $(serviceConnection)

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              commandOptions: '-var="sql_admin_password=$(SQL_PASSWORD)" -auto-approve'
              environmentServiceNameAzureRM: $(serviceConnection)

  - stage: BuildDeploy
    displayName: "Build & Deploy App"
    dependsOn: Infrastructure
    condition: succeeded()
    jobs:
      - job: Build
        displayName: "Build Python App"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              python -m venv antenv
              source antenv/bin/activate
              pip install -r requirements.txt
            displayName: "Install Dependencies"

          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: $(System.DefaultWorkingDirectory)
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: "drop"
              publishLocation: "Container"

      - job: Deploy
        displayName: "Deploy to Function"
        dependsOn: Build
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: $(System.ArtifactsDirectory)

          # Dynamic lookup of the Function App name
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Query Azure for the function app name created by Terraform
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[0].name" -o tsv)
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          - task: AzureFunctionApp@1
            displayName: "Deploy Function App"
            inputs:
              azureSubscription: "$(serviceConnection)"
              appType: "functionAppLinux"
              appName: "$(funcAppName)"
              package: "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip"

      - job: DeployFrontend
        displayName: "Deploy Frontend"
        dependsOn: Build
        steps:
          - checkout: self

          # 1. Get Static Web App Name
          - task: AzureCLI@2
            displayName: "Get Static Web App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                SWA_NAME=$(az staticwebapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[0].name" -o tsv)
                echo "##vso[task.setvariable variable=swaName]$SWA_NAME"

          # 2. Get Deployment Token (Required for SWA task)
          - task: AzureCLI@2
            displayName: "Get SWA Deployment Token"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                API_TOKEN=$(az staticwebapp secrets list --name $(swaName) --resource-group rg-$(projectPrefix)-$(environment) --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=swaToken;issecret=true]$API_TOKEN"

          # 3. Deploy Content
          - task: AzureStaticWebApp@0
            displayName: "Deploy to Static Web App"
            inputs:
              app_location: "/templates" # Directory containing index.html
              api_location: "" # API is hosted separately (Function App)
              output_location: "" # No build step for simple HTML/JS
              azure_static_web_apps_api_token: $(swaToken)
