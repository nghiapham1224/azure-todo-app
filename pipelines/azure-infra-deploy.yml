trigger: none

pool:
  vmImage: "ubuntu-latest"

variables:
  # Backend Config (Should be passed as variables or defined here if static)
  # Ensure you create this Storage Account manually before running!
  tf_backend_resource_group: "rg-terraform-state"
  tf_backend_storage_account: "tfstate12072025"
  tf_backend_container: "tfstate"
  tf_backend_key: "todo-dev.tfstate"

  serviceConnection: "sp-deploy-student"

stages:
  - stage: Infrastructure
    displayName: "Deploy Infrastructure"
    jobs:
      - job: Terraform
        displayName: "Terraform Apply"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(tf_backend_resource_group)
              backendAzureRmStorageAccountName: $(tf_backend_storage_account)
              backendAzureRmContainerName: $(tf_backend_container)
              backendAzureRmKey: $(tf_backend_key)
              commandOptions: "-upgrade"

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              environmentServiceNameAzureRM: $(serviceConnection)

          - task: ManualValidation@0
            displayName: "Manual approval before Terraform Apply"
            inputs:
              notifyUsers: ""
              instructions: "Review the Terraform plan output in the pipeline and approve to continue with Terraform Apply."

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(System.DefaultWorkingDirectory)/terraform"
              commandOptions: "-auto-approve"
              environmentServiceNameAzureRM: $(serviceConnection)
