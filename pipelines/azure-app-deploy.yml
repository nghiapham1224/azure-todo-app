trigger:
  branches:
    include:
      - prod
      - dev
  paths:
    exclude:
      - terraform/**
      - pipelines/azure-infrastructure.yml

pool:
  vmImage: "ubuntu-latest"

variables:
  # --- Project Variables ---
  projectPrefix: "todo"
  environment: "dev"
  pythonVersion: "3.13"

  # --- Service Connection ---
  serviceConnection: "sp-deploy"

stages:
  - stage: BuildDeploy
    displayName: "Build & Deploy App"
    jobs:
      # =========================================================
      # JOB 1: BUILD
      # =========================================================
      - job: Build
        displayName: "Build Python App"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              python -m venv antenv
              source antenv/bin/activate
              pip install -r requirements.txt
            displayName: "Install Dependencies"

          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: $(System.DefaultWorkingDirectory)
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: "drop"
              publishLocation: "Container"

      # =========================================================
      # JOB 2: DEPLOY BACKEND (FUNCTION APP)
      # =========================================================
      - job: DeployBackend
        displayName: "Deploy Function App"
        dependsOn: Build
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: $(System.ArtifactsDirectory)

          # 1. Get Function App Name
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                echo "Found Function App: $FUNC_NAME"
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          # 2. Deploy to Storage & Configure App (FIXED: Uses Account Key)
          - task: AzureCLI@2
            displayName: "Deploy to Storage & Configure App"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Get Storage Account Name
                STORAGE_NAME=$(az storage account list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'sa$(projectPrefix)$(environment)')].name | [0]" -o tsv)
                echo "Found Storage Account: $STORAGE_NAME"

                # Get Storage Key (Bypasses RBAC Data Role issues)
                STORAGE_KEY=$(az storage account keys list --resource-group rg-$(projectPrefix)-$(environment) --account-name $STORAGE_NAME --query "[0].value" -o tsv)

                # Upload Zip
                echo "Uploading artifact to Blob Storage..."
                az storage blob upload \
                  --account-name $STORAGE_NAME \
                  --account-key $STORAGE_KEY \
                  --container-name deployment-package \
                  --name "$(Build.BuildId).zip" \
                  --file "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip"

                # Construct Blob URL
                BLOB_URL="https://$STORAGE_NAME.blob.core.windows.net/deployment-package/$(Build.BuildId).zip"
                echo "Blob URL: $BLOB_URL"

                # Update Function App Setting
                echo "Updating Function App to run from package..."
                az functionapp config appsettings set \
                  --resource-group rg-$(projectPrefix)-$(environment) \
                  --name $(funcAppName) \
                  --settings "WEBSITE_RUN_FROM_PACKAGE=$BLOB_URL"

          # 3. Smoke Test (FIXED: Uses Retry Loop)
          - script: |
              MAX_RETRIES=12
              WAIT_TIME=10
              ATTEMPTS=0
              FUNC_URL="https://$(funcAppName).azurewebsites.net/api/health"

              echo "Waiting for app to start and respond (Max $((MAX_RETRIES * WAIT_TIME))s)..."

              while [ $ATTEMPTS -lt $MAX_RETRIES ]; do
                sleep $WAIT_TIME
                # Check HTTP Status Code
                RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $FUNC_URL)
                echo "Attempt $((ATTEMPTS + 1))/$MAX_RETRIES: Health Check Response: $RESPONSE"

                if [ "$RESPONSE" -eq "200" ]; then
                  echo "App is healthy and DB init triggered."
                  exit 0
                fi

                ATTEMPTS=$((ATTEMPTS + 1))
              done

              echo "##vso[task.logissue type=warning]Warning: Function App did not become healthy after $((MAX_RETRIES * WAIT_TIME)) seconds."
              # We do not exit 1 here to allow the pipeline to proceed to Frontend deployment if desired,
              # but usually, you might want to fail here.
            displayName: "Trigger DB Initialization (Retry Loop)"

      # =========================================================
      # JOB 3: DEPLOY FRONTEND (STATIC WEB APP)
      # =========================================================
      - job: DeployFrontend
        displayName: "Deploy Frontend"
        dependsOn: DeployBackend
        steps:
          - checkout: self

          # 1. Get Secrets from Key Vault
          - task: AzureKeyVault@2
            displayName: "Get Secrets from Key Vault"
            inputs:
              azureSubscription: "$(serviceConnection)"
              KeyVaultName: "kv-terraform20251207" # Ensure this matches your actual KV name
              SecretsFilter: "swa-token-$(projectPrefix)-$(environment)"
              RunAsPreJob: false

          # 2. Get Function App Name (Needed for URL injection)
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          # 3. Inject Backend URL into index.html
          - script: |
              FULL_API_URL="https://$(funcAppName).azurewebsites.net/api/todos"
              echo "Injecting Backend URL: $FULL_API_URL"

              sed -i "s|__BACKEND_API_URL__|$FULL_API_URL|g" templates/index.html
            displayName: "Configure Frontend Config"

          # 4. Deploy to Static Web App
          - task: AzureStaticWebApp@0
            displayName: "Deploy Static Content"
            inputs:
              app_location: "/templates"
              api_location: ""
              output_location: ""
              azure_static_web_apps_api_token: $(swa-token-$(projectPrefix)-$(environment))
