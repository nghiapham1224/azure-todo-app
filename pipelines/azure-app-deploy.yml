trigger:
  branches:
    include:
      - dev
  paths:
    exclude:
      - terraform/**
      - pipelines/azure-infrastructure.yml

pool:
  vmImage: "ubuntu-latest"

variables:
  # --- Application Variables ---
  projectPrefix: "todo-app"
  environment: "dev"
  pythonVersion: "3.10"

  # --- Service Connection ---
  serviceConnection: "sp-deploy"

stages:
  - stage: BuildDeploy
    displayName: "Build & Deploy App"
    jobs:
      - job: Build
        displayName: "Build Python App"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              python -m venv antenv
              source antenv/bin/activate
              pip install -r requirements.txt
            displayName: "Install Dependencies"

          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: $(System.DefaultWorkingDirectory)
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: "drop"
              publishLocation: "Container"

      - job: DeployBackend
        displayName: "Deploy Function App"
        dependsOn: Build
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: $(System.ArtifactsDirectory)

          # Dynamic lookup of the Function App name
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Query Azure for the function app name created by Terraform
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[0].name" -o tsv)
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          - task: AzureFunctionApp@1
            displayName: "Deploy Function App"
            inputs:
              azureSubscription: "$(serviceConnection)"
              appType: "functionAppLinux"
              appName: "$(funcAppName)"
              package: "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip"

      - job: DeployFrontend
        displayName: "Deploy Frontend"
        dependsOn: DeployBackend
        steps:
          - checkout: self 
          
          # 1. Get Static Web App Name
          - task: AzureCLI@2
            displayName: "Get Static Web App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                SWA_NAME=$(az staticwebapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[0].name" -o tsv)
                echo "##vso[task.setvariable variable=swaName]$SWA_NAME"

          # 2. Get Deployment Token (Required for SWA task)
          - task: AzureCLI@2
            displayName: "Get SWA Deployment Token"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                API_TOKEN=$(az staticwebapp secrets list --name $(swaName) --resource-group rg-$(projectPrefix)-$(environment) --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=swaToken;issecret=true]$API_TOKEN"

          # 3. Inject Backend URL into index.html
          - task: AzureCLI@2
            displayName: "Inject Backend URL"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Get Function App Name
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[0].name" -o tsv)
                
                # Construct URL
                FULL_API_URL="https://$FUNC_NAME.azurewebsites.net/api/todos"
                echo "Detected Backend URL: $FULL_API_URL"
                
                # Replace placeholder in index.html
                # We use | as delimiter to avoid issues with slashes in the URL
                sed -i "s|__BACKEND_API_URL__|$FULL_API_URL|g" templates/index.html
                
                # Verify change
                echo "Verification:"
                grep "let API_URL" templates/index.html

          # 4. Deploy Content
          - task: AzureStaticWebApp@0
            displayName: "Deploy to Static Web App"
            inputs:
              app_location: "/templates" # Directory containing index.html
              api_location: "" # API is hosted separately (Function App)
              output_location: "" # No build step for simple HTML/JS
              azure_static_web_apps_api_token: $(swaToken)
