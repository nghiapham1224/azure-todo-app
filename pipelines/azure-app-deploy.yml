trigger:
  branches:
    include:
      - prod
  paths:
    exclude:
      - terraform/**
      - pipelines/azure-infrastructure.yml
pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  # --- Project Variables ---
  projectPrefix: "todo"
  environment: "dev"
  pythonVersion: "3.13"

  # --- Service Connection ---
  serviceConnection: "sp-deploy-student"

stages:
  - stage: BuildDeploy
    displayName: "Build & Deploy App"
    jobs:
      # =========================================================
      # JOB 1: BUILD
      # =========================================================
      - job: Build
        displayName: "Build Python App"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              # python -m venv antenv
              # source antenv/bin/activate
              pip install --target="./.python_packages/lib/site-packages" -r requirements.txt
            displayName: "Install Dependencies"

          # Create a suitable archive for Azure Functions
          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: $(System.DefaultWorkingDirectory)
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: "drop"
              publishLocation: "Container"

      # =========================================================
      # JOB 2: DEPLOY BACKEND
      # =========================================================
      - job: DeployBackend
        displayName: "Deploy Function App"
        dependsOn: Build
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: $(System.ArtifactsDirectory)

          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e # Fail on error
                echo "Looking for function app..."
                FUNC_NAME=$(az functionapp list -g rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                echo "Found Function: $FUNC_NAME"
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          - task: AzureFunctionApp@2
            displayName: "Deploy Backend Code"
            inputs:
              connectedServiceNameARM: "$(serviceConnection)"
              appType: "functionAppLinux"
              appName: "$(funcAppName)"
              package: "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip"

          # Health Check (Retry Loop)
          - script: |
              MAX_RETRIES=20
              WAIT_TIME=10
              ATTEMPTS=0
              FUNC_URL="https://$(funcAppName).azurewebsites.net/api/health"

              echo "Waiting for app to start..."
              while [ $ATTEMPTS -lt $MAX_RETRIES ]; do
                sleep $WAIT_TIME
                RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" -H "Host: $(funcAppName).azurewebsites.net" $FUNC_URL)
                echo "Attempt $((ATTEMPTS+1)): $RESPONSE"
                if [ "$RESPONSE" -eq "200" ]; then
                  echo "Success! App is healthy."
                  exit 0
                fi
                ATTEMPTS=$((ATTEMPTS+1))
              done
              echo "##vso[task.logissue type=warning]App failed to start within time limit."
              exit 1
            displayName: "Health Check"

      # =========================================================
      # JOB 3: DEPLOY FRONTEND
      # =========================================================
      - job: DeployFrontend
        displayName: "Deploy Frontend"
        dependsOn: DeployBackend
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Configure & Get Secrets"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # 1. Get Function Name
                FUNC_NAME=$(az functionapp list -g rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                FULL_API_URL="https://$FUNC_NAME.azurewebsites.net/api/todos"

                # 2. Inject URL
                echo "Injecting API URL: $FULL_API_URL"
                sed -i "s|__BACKEND_API_URL__|$FULL_API_URL|g" templates/index.html

                # 3. Get SWA Token Manually (Reliable Fallback)
                echo "Fetching SWA Token..."
                SWA_NAME=$(az staticwebapp list -g rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'swa-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                TOKEN=$(az staticwebapp secrets list -n $SWA_NAME -g rg-$(projectPrefix)-$(environment) --query "properties.apiKey" -o tsv)

                if [ -z "$TOKEN" ]; then
                  echo "##vso[task.logissue type=error]Failed to retrieve SWA Token!"
                  exit 1
                fi

                echo "##vso[task.setvariable variable=swaToken;issecret=true]$TOKEN"

          - task: AzureStaticWebApp@0
            displayName: "Deploy Static Content"
            inputs:
              app_location: "/templates"
              api_location: ""
              output_location: ""
              azure_static_web_apps_api_token: $(swaToken)
