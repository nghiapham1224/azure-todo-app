trigger:
  branches:
    include:
      - prod
      - dev
  paths:
    exclude:
      - terraform/**
      - pipelines/azure-infrastructure.yml

pool:
  vmImage: "ubuntu-latest"

variables:
  # --- Project Variables ---
  projectPrefix: "todo"
  environment: "dev"
  pythonVersion: "3.13"

  # --- Service Connection ---
  serviceConnection: "sp-deploy"
  # Ensure this Service Connection exists in ADO and has Contributor access to the Subscription

stages:
  - stage: BuildDeploy
    displayName: "Build & Deploy App"
    jobs:
      - job: Build
        displayName: "Build Python App"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python $(pythonVersion)"
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              python -m venv antenv
              source antenv/bin/activate
              pip install -r requirements.txt
            displayName: "Install Dependencies"

          # Create a suitable archive for Azure Functions
          - task: ArchiveFiles@2
            displayName: "Archive files"
            inputs:
              rootFolderOrFile: $(System.DefaultWorkingDirectory)
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: "drop"
              publishLocation: "Container"

      - job: DeployBackend
        displayName: "Deploy Function App"
        dependsOn: Build
        steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: $(System.ArtifactsDirectory)

          # Get Function App Name (Dynamically from Azure to match Terraform)
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Finds the function app starting with 'func-todo-dev'
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                echo "Found Function App: $FUNC_NAME"
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          # Custom Deployment for VNet-Integrated Flex Consumption
          - task: AzureCLI@2
            displayName: "Deploy to Storage & Configure App"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # 1. Get Storage Account Name
                STORAGE_NAME=$(az storage account list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'sa$(projectPrefix)$(environment)')].name | [0]" -o tsv)
                echo "Found Storage Account: $STORAGE_NAME"

                # 2. Upload Zip to 'deployment-package' container
                echo "Uploading artifact to Blob Storage..."
                az storage blob upload \
                  --account-name $STORAGE_NAME \
                  --container-name deployment-package \
                  --name "$(Build.BuildId).zip" \
                  --file "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip" \
                  --auth-mode login

                # 3. Construct Blob URL
                BLOB_URL="https://$STORAGE_NAME.blob.core.windows.net/deployment-package/$(Build.BuildId).zip"
                echo "Blob URL: $BLOB_URL"

                # 4. Update Function App Setting (WEBSITE_RUN_FROM_PACKAGE)
                echo "Updating Function App to run from package..."
                az functionapp config appsettings set \
                  --resource-group rg-$(projectPrefix)-$(environment) \
                  --name $(funcAppName) \
                  --settings "WEBSITE_RUN_FROM_PACKAGE=$BLOB_URL"

          # --- SMOKE TEST & DB INIT ---
          # This step calls the API, which triggers the 'init_db()' function in the code.
          # Since Public Access is enabled on the Function App, the Agent can reach it.
          - script: |
              echo "Waiting for app to start..."
              sleep 10
              echo "Triggering DB Init via API..."
              # We use a POST to /api/todos with dummy data to force a DB write attempt
              # OR just a GET to /api/health if init_db is called there.
              # Based on code, init_db is called in ALL routes.

              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://$(funcAppName).azurewebsites.net/api/health)
              echo "Health Check Response: $RESPONSE"

              if [ "$RESPONSE" -eq "200" ]; then
                echo "App is healthy and DB init triggered."
              else
                echo "Warning: App returned $RESPONSE. DB might not be initialized."
                # Don't fail the build yet, as it might be a cold start issue
              fi
            displayName: "Trigger DB Initialization"

      - job: DeployFrontend
        displayName: "Deploy Frontend"
        dependsOn: DeployBackend
        steps:
          - checkout: self

          # 1. Get Function App Name (needed for URL injection)
          - task: AzureCLI@2
            displayName: "Get Function App Name"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                FUNC_NAME=$(az functionapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'func-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                echo "##vso[task.setvariable variable=funcAppName]$FUNC_NAME"

          # 2. Deploy Backend Artifact to Storage & Configure App
          - task: AzureCLI@2
            displayName: "Deploy to Storage & Configure App"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                # Get Storage Account Name
                STORAGE_NAME=$(az storage account list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'sa$(projectPrefix)$(environment)')].name | [0]" -o tsv)
                echo "Found Storage Account: $STORAGE_NAME"

                # Get Storage Account Key (for auth)
                STORAGE_KEY=$(az storage account keys list --resource-group rg-$(projectPrefix)-$(environment) --account-name $STORAGE_NAME --query "[0].value" -o tsv)

                # Upload Zip to 'deployment-package' container
                echo "Uploading artifact to Blob Storage..."
                az storage blob upload \
                  --account-name $STORAGE_NAME \
                  --account-key $STORAGE_KEY \
                  --container-name deployment-package \
                  --name "$(Build.BuildId).zip" \
                  --file "$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip"

                # Construct Blob URL
                BLOB_URL="https://$STORAGE_NAME.blob.core.windows.net/deployment-package/$(Build.BuildId).zip"
                echo "Blob URL: $BLOB_URL"

                # Update Function App Setting (WEBSITE_RUN_FROM_PACKAGE)
                echo "Updating Function App to run from package..."
                az functionapp config appsettings set \
                  --resource-group rg-$(projectPrefix)-$(environment) \
                  --name $(funcAppName) \
                  --settings "WEBSITE_RUN_FROM_PACKAGE=$BLOB_URL"

          # 3. Inject Backend URL into index.html
          - script: |
              FULL_API_URL="https://$(funcAppName).azurewebsites.net/api/todos"
              echo "Injecting Backend URL: $FULL_API_URL"
              sed -i "s|__BACKEND_API_URL__|$FULL_API_URL|g" templates/index.html
            displayName: "Configure Frontend Config"

          # 4. Get SWA Token (Directly)
          - task: AzureCLI@2
            displayName: "Get SWA Deployment Token"
            inputs:
              azureSubscription: "$(serviceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                SWA_NAME=$(az staticwebapp list --resource-group rg-$(projectPrefix)-$(environment) --query "[?starts_with(name, 'swa-$(projectPrefix)-$(environment)')].name | [0]" -o tsv)
                API_TOKEN=$(az staticwebapp secrets list --name $SWA_NAME --resource-group rg-$(projectPrefix)-$(environment) --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=swaToken;issecret=true]$API_TOKEN"

          # 5. Deploy to Static Web App
          - task: AzureStaticWebApp@0
            displayName: "Deploy Static Content"
            inputs:
              app_location: "/templates"
              api_location: ""
              output_location: ""
              azure_static_web_apps_api_token: $(swaToken)
