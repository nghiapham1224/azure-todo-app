<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simple Todo App</title>
        <style>
            /* --- General Styling --- */
            body {
                font-family: "Segoe UI", sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
                margin: 0;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                background: white;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                padding: 30px;
            }
            h1 {
                text-align: center;
                color: #333;
                margin-bottom: 30px;
            }

            /* Form */
            .add-todo-form {
                display: flex;
                gap: 10px;
                margin-bottom: 30px;
            }
            input[type="text"] {
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 5px;
                font-size: 14px;
            }
            #todoTitle {
                flex: 1;
            }
            #todoDescription {
                flex: 2;
            }
            button {
                padding: 12px 24px;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-weight: 600;
            }
            button:hover {
                background: #5568d3;
            }

            /* List */
            .todo-list {
                list-style: none;
                padding: 0;
            }
            .todo-item {
                background: #f8f9fa;
                padding: 15px;
                margin-bottom: 10px;
                border-radius: 5px;
                display: flex;
                align-items: center;
                gap: 15px;
            }
            .todo-item.completed {
                opacity: 0.6;
            }
            .todo-item.completed h3,
            .todo-item.completed p {
                text-decoration: line-through;
            }

            .todo-content {
                flex: 1;
            }
            .todo-content h3 {
                margin: 0 0 5px 0;
                font-size: 18px;
                color: #333;
            }
            .todo-content p {
                margin: 0 0 5px 0;
                color: #666;
                font-size: 14px;
            }
            .todo-content small {
                color: #999;
                font-size: 12px;
            }

            /* Delete Button */
            .delete-btn {
                background: #e74c3c;
                padding: 8px 16px;
                font-size: 12px;
            }
            .delete-btn:hover {
                background: #c0392b;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>My Todo List</h1>

            <div class="add-todo-form">
                <input type="text" id="todoTitle" placeholder="Title" />
                <input
                    type="text"
                    id="todoDescription"
                    placeholder="Description (optional)"
                />
                <button onclick="addTodo()">Add</button>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- Items load here -->
            </ul>
        </div>

        <script>
            // Placeholder: The CI/CD pipeline will replace '__BACKEND_API_URL__' with the real Azure URL.
            // If running locally, it remains '__BACKEND_API_URL__', so we fallback to localhost.
            let API_URL = "https://func-todo-manual.azurewebsites.net/api/todos";
            if (API_URL === "__BACKEND_API_URL__") {
                API_URL = "http://localhost:7071/api/todos";
            }

            async function loadTodos() {
                const response = await fetch(API_URL);
                const todos = await response.json();

                const list = document.getElementById("todoList");
                list.innerHTML = "";

                todos.forEach((todo) => {
                    // Simple date formatting
                    const date = new Date(todo.created_time).toLocaleString();

                    list.innerHTML += `
                    <li class="todo-item ${todo.completed ? "completed" : ""}">
                        <input type="checkbox"
                               ${todo.completed ? "checked" : ""}
                               onclick="toggleTodo(${todo.id}, ${todo.completed})">

                        <div class="todo-content">
                            <h3>${todo.title}</h3>
                            <p>${todo.description || ""}</p>
                            <small>Created: ${date}</small>
                        </div>

                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                    </li>
                `;
                });
            }

            async function addTodo() {
                const title = document.getElementById("todoTitle");
                const desc = document.getElementById("todoDescription");

                if (!title.value) return;

                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: title.value,
                        description: desc.value,
                    }),
                });

                title.value = "";
                desc.value = "";
                loadTodos();
            }

            async function toggleTodo(id, currentStatus) {
                await fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: !currentStatus }),
                });
                loadTodos();
            }

            async function deleteTodo(id) {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                loadTodos();
            }

            loadTodos();
        </script>
    </body>
</html>
